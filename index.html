<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Raihan Rony — Backend Engineer specializing in Laravel, Django, and scalable systems. View my projects and get in touch." />
    <title>Raihan Rony — Backend Engineer</title>

    <!-- Non-blocking font loading (replaces render-blocking @import in CSS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    />
    <!-- Theme init: runs synchronously before first paint to prevent flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          // Default to dark if no preference has been saved
          if (saved === 'light') return;
          document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
